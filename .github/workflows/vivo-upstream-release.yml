name: Sync upstream and build VIVO APK

on:
  schedule:
    # GitHub schedules use UTC.
    # 03:17 UTC = 11:17 China time
    - cron: '17 3 * * *'

  workflow_dispatch:
    inputs:
      force_build:
        description: Force rebuild the latest upstream release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vivo-upstream-build
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: umr-xiaomai/kgka_Music_hl
  VIVO_BRANCH: vivo
  APK_NAME: KA-Music-vivo-atomic-arm64.apk

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout VIVO branch
      # ============================================================
      - name: Checkout VIVO branch
        uses: actions/checkout@v4
        with:
          ref: vivo
          fetch-depth: 0
          lfs: true

      # ============================================================
      # 2. Detect latest upstream release
      # ============================================================
      - name: Detect latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"

          echo "upstream_tag=${latest}" >> "$GITHUB_OUTPUT"

          echo "Latest upstream release: ${latest}"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Force build enabled."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check whether the VIVO branch already contains this upstream tag.
          if git merge-base --is-ancestor \
            "refs/tags/upstream-${latest}" \
            HEAD 2>/dev/null; then
            echo "This upstream release is already merged."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release detected."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 3. Merge latest upstream release into VIVO branch
      # ============================================================
      - name: Merge upstream release into VIVO branch
        if: steps.upstream.outputs.needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            "https://github.com/${UPSTREAM_REPOSITORY}.git"

          git fetch upstream \
            "refs/tags/${UPSTREAM_TAG}:refs/tags/upstream-${UPSTREAM_TAG}"

          git merge --no-edit \
            "refs/tags/upstream-${UPSTREAM_TAG}"

          git push origin "HEAD:${VIVO_BRANCH}"

      # ============================================================
      # 4. Set up Flutter
      # ============================================================
      - name: Set up Flutter
        if: steps.upstream.outputs.needed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 5. Restore Android signing key
      # ============================================================
      - name: Restore Android signing key
        if: steps.upstream.outputs.needed == 'true'
        env:
          VIVO_KEYSTORE_BASE64: ${{ secrets.VIVO_KEYSTORE_BASE64 }}
          VIVO_STORE_PASSWORD: ${{ secrets.VIVO_STORE_PASSWORD }}
          VIVO_KEY_ALIAS: ${{ secrets.VIVO_KEY_ALIAS }}
          VIVO_KEY_PASSWORD: ${{ secrets.VIVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$VIVO_KEYSTORE_BASE64"
          test -n "$VIVO_STORE_PASSWORD"
          test -n "$VIVO_KEY_ALIAS"
          test -n "$VIVO_KEY_PASSWORD"

          printf '%s' "$VIVO_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/vivo-release.jks

          {
            echo 'storeFile=app/vivo-release.jks'
            echo "storePassword=${VIVO_STORE_PASSWORD}"
            echo "keyAlias=${VIVO_KEY_ALIAS}"
            echo "keyPassword=${VIVO_KEY_PASSWORD}"
          } > android/key.properties

      # ============================================================
      # 6. Install dependencies and run tests
      # ============================================================
      - name: Install dependencies and run tests
        if: steps.upstream.outputs.needed == 'true'
        run: |
          set -euo pipefail

          flutter config --no-analytics
          flutter pub get
          flutter test

      # ============================================================
      # 7. Build VIVO compatibility APK
      # ============================================================
      - name: Build VIVO compatibility APK
        if: steps.upstream.outputs.needed == 'true'
        run: |
          set -euo pipefail

          build() {
            flutter build apk --release \
              --target-platform android-arm64 \
              --android-project-arg=kaApplicationId=cn.aqzscn.stream_music
          }

          build || {
            echo "Build failed. Waiting 90 seconds and retrying..."
            sleep 90
            build
          }

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "$APK_NAME"

          echo "APK generated:"
          ls -lh "$APK_NAME"

      # ============================================================
      # 8. Upload APK to GitHub Actions Artifacts
      # ============================================================
      - name: Upload APK to Actions
        if: steps.upstream.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KA-Music-VIVO-com.leting-arm64
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
```
